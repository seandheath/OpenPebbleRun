# Project-wide Gradle properties.

# JVM args for Gradle daemon. 2G is comfortable for AGP 8 + Compose.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is required for AGP 8+.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Non-transitive R classes — smaller, faster builds. Default in AGP 8+.
android.nonTransitiveRClass=true
